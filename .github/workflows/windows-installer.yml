
      - name: Package installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            $compiler = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }

          if (!(Test-Path $compiler)) {
            throw "Inno Setup compiler not found."
          }

          # Verify required files before packaging.
          $requiredFiles = @(
            "installer/rdcli.iss",
            "dist/rdcli.exe",
            "README.md",
            "LICENSE"
          )

          foreach ($file in $requiredFiles) {
            if (!(Test-Path $file)) {
              throw "Required file is missing: $file"
            }
          }

          # Use absolute paths to avoid working-directory ambiguity.
          $projectRoot = (Get-Location).Path
          $scriptPath = Join-Path $projectRoot "installer\rdcli.iss"
          $outputDir = Join-Path $projectRoot "dist"

          & $compiler "/O$outputDir" $scriptPath

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

          if (!(Test-Path (Join-Path $outputDir "rdcli-setup.exe"))) {
            throw "Installer file was not generated."
          }
